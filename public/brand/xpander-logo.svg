    <path d="M -1.6 -2.4 C -2.3 -4.5, -2.4 -7.5, 0 -10 C 2.4 -7.5, 2.3 -4.5, 1.6 -2.4 C 1 -1.4, -1 -1.4, -1.6 -2.4 Z" transform="rotate(315)" />
  </g>
  <!-- Typography -->
