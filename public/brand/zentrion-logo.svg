<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 90" fill="none">
  <defs>
    <linearGradient id="textGrad" x1="0" y1="0" x2="0" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d4d4d8"/>
    </linearGradient>
    <filter id="logoGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Embedded Icon Mark on Left -->
  <g transform="translate(10, 8) scale(0.74)">
    <rect width="100" height="100" rx="22" fill="#0f0f12" stroke="#ffffff" stroke-width="1.8" stroke-opacity="0.3"/>
    <mask id="bannerMask">
      <rect width="100" height="100" fill="#ffffff"/>
      <circle cx="50" cy="50" r="10" fill="#000000"/>
    </mask>
    <path d="M 18 20 L 82 20 L 82 34 L 41 66 L 82 66 L 82 80 L 18 80 L 18 66 L 59 34 L 18 34 Z" fill="#ffffff" mask="url(#bannerMask)"/>
    <circle cx="50" cy="50" r="5.5" fill="#ffffff" filter="url(#logoGlow)"/>
    <circle cx="50" cy="50" r="8.2" fill="none" stroke="#ffffff" stroke-width="0.9" opacity="0.7"/>
  </g>

  <!-- Wordmark 'ZENTRION' -->
  <text x="102" y="56" fill="url(#textGrad)" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" letter-spacing="4">ZENTRION</text>
  
  <!-- Suffix '.AI' -->
  <text x="314" y="56" fill="#a1a1aa" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="300">.ai</text>

  <!-- High-Tech Tagline -->
  <text x="104" y="74" fill="#71717a" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" letter-spacing="3.2">AUTONOMOUS ENTERPRISE INFRASTRUCTURE</text>
</svg>